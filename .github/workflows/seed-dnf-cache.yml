name: seed-dnf-cache

# Weekly single-writer seed for the shared libdnf5 cache that build-stage
# jobs bind-mount (work/dnf-cache). Matrix jobs only ever RESTORE: 70
# parallel writers racing to upload GB-sized caches would thrash the 10GB
# repo cache budget with last-writer-wins semantics, so exactly one job
# writes, keyed by ISO week with prefix fallback for mid-week runs.
#
# Safety properties (why a stale/partial cache cannot poison builds):
# - dnf revalidates metadata per metadata_expire and checksums every RPM.
# - A missing or corrupt cache is a silent miss; jobs build cold.

on:
  schedule:
    - cron: '0 5 * * 0'  # Weekly, Sunday 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seed:
    name: Seed shared dnf cache
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Pull Fedora 44 build container
        run: podman pull quay.io/fedora/fedora:44

      - name: Resolve all buildroots into the shared cache
        run: |
          mkdir -p work/dnf-cache
          PACKAGES=$(python3 pigeon/tools/packit_workflow.py packages | tr '\n' ' ')
          echo "seeding builddeps for: $PACKAGES"
          podman run --rm \
            -v "$PWD:/repo:Z" \
            -v "$PWD/work/dnf-cache:/var/cache/libdnf5:Z" \
            -e PACKAGES="$PACKAGES" \
            quay.io/fedora/fedora:44 \
            bash -exc '
              dnf install -qy dnf-plugins-core
              printf "\nkeepcache=1\n" >> /etc/dnf/dnf.conf
              printf "[hummingbird]\nname=Hummingbird public\nbaseurl=https://koji-s3-cache.hummingbird-project.io/packages.redhat.com/api/pulp-content/public-hummingbird/x86_64/\nenabled=1\ngpgcheck=0\nexclude=ruby* rubygem*\n" \
                > /etc/yum.repos.d/hummingbird.repo
              for PKG in $PACKAGES; do
                SPEC=$(ls /repo/pigeon/packages/$PKG/*.spec | head -1) || continue
                echo "=== builddep $PKG ==="
                dnf builddep -y --skip-unavailable "$SPEC" 2>&1 | tail -2 || \
                  echo "WARNING: builddep failed for $PKG, continuing"
              done
            '
          du -sh work/dnf-cache | tee work/dnf-cache-size.txt

      - name: Compute cache key
        id: key
        run: |
          WEEK=$(date -u +%G-W%V)
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "key=pigeon-dnf-f44-$WEEK" >> "$GITHUB_OUTPUT"

      - name: Save shared dnf cache
        # Always save: a partial cache is still better than cold, and old
        # weekly keys remain as restore fallbacks until LRU-evicted.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: work/dnf-cache
          key: ${{ steps.key.outputs.key }}

      - name: Publish cache summary
        if: always()
        run: |
          {
            echo "## Shared dnf cache seed"
            echo ""
            echo "Key: \`${{ steps.key.outputs.key }}\`"
            echo ""
            echo "Size: \`$(cat work/dnf-cache-size.txt 2>/dev/null || echo unknown)\`"
          } >> "$GITHUB_STEP_SUMMARY"
