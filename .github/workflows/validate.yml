name: validate
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 pigeon/tools/factory_contract.py
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PyYAML
        run: pip install pyyaml -q
      - run: python3 pigeon/tools/validate.py
      - run: python3 pigeon/tools/validate_packit_config.py
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pytest
        run: pip install pytest -q
      - run: python3 -m pytest pigeon/tests -q