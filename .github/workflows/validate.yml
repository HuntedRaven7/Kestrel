name: validate
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 pigeon/tools/factory_contract.py
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 pigeon/tools/validate.py
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: pip install pytest -q
      - run: python3 -m pytest pigeon/tests -q