name: validate
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 pigeon/tools/factory_contract.py
  packages:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 pigeon/tools/validate.py
      - run: python3 pigeon/tools/sync_versions.py --check
      # Static pre-rpmbuild gate: every SourceN/PatchN must be satisfiable,
      # otherwise rpmbuild -bs dies with "Bad file: ...: No such file".
      - run: python3 pigeon/tools/audit_sources.py --spec-sources
  unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pytest
        run: pip install pytest -q
      - name: Install PyYAML
        run: pip install pyyaml -q
      - run: python3 -m pytest pigeon/tests -q