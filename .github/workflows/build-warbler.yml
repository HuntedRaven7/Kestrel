name: build-warbler

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build (main, nvidia, gaming, nvidia-gaming)"
        required: false
        type: string
        default: "main"
      push:
        description: "Push to registry"
        required: false
        type: boolean
        default: false
      iso:
        description: "Also build ISO"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  kernel-cache:
    name: Build kernel cache image (for nvidia/gaming flavors)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    if: ${{ github.event.inputs.flavor != 'main' }}
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Build kernel cache image
        run: |
          podman build -f warbler/Containerfile.kernel \
            --build-arg BASE_IMAGE=quay.io/hummingbird-community/bootc-os@sha256:TODO_BASE_IMAGE_SHA \
            -t ghcr.io/huntedraven7/warbler-kernel-cache:latest \
            warbler/.

      - name: Get image digest
        id: digest
        run: |
          digest=$(podman inspect ghcr.io/huntedraven7/warbler-kernel-cache:latest --format '{{.Digest}}')
          echo "digest=$digest" >> $GITHUB_OUTPUT

      - name: Push kernel cache image
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        run: |
          podman push ghcr.io/huntedraven7/warbler-kernel-cache:latest
          podman tag ghcr.io/huntedraven7/warbler-kernel-cache:latest ghcr.io/huntedraven7/warbler-kernel-cache:${{ steps.digest.outputs.digest }}
          podman push ghcr.io/huntedraven7/warbler-kernel-cache:${{ steps.digest.outputs.digest }}

  build:
    name: Build Warbler (${{ matrix.flavor }})
    needs: [kernel-cache]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(github.event.inputs.flavor == 'main' && '["main"]' || '["main", "nvidia", "gaming", "nvidia-gaming"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      sbom_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Build Warbler image
        run: |
          KERNEL_CACHE_SHA="${{ needs.kernel-cache.outputs.digest }}"
          if [ "${{ matrix.flavor }}" = "main" ]; then
            KERNEL_CACHE_SHA="sha256:TODO_KERNEL_CACHE_SHA"
          fi
          podman build -f warbler/Containerfile \
            --build-arg BASE_IMAGE=quay.io/hummingbird-community/bootc-os@sha256:TODO_BASE_IMAGE_SHA \
            --build-arg KERNEL_CACHE_IMAGE=ghcr.io/huntedraven7/warbler-kernel-cache@${KERNEL_CACHE_SHA} \
            --build-arg PIGEON_IMAGE=ghcr.io/huntedraven7/pigeon@sha256:TODO_PIGEON_IMAGE_SHA \
            --build-arg IMAGE_FLAVOR=${{ matrix.flavor }} \
            --build-arg VERSION=testing \
            -t ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-testing \
            warbler/.

      - name: Bootc lint
        run: |
          podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-testing \
            bootc container lint --fatal-warnings

      - name: Push image
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        run: |
          podman push ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-testing
          # Also tag with digest for immutable reference
          digest=$(podman inspect ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-testing --format '{{.Digest}}')
          podman tag ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-testing ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-${digest}
          podman push ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-${digest}

      - name: Install cosign
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Cosign sign
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        run: |
          cosign sign --yes ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-testing

      - name: Generate SBOM (syft)
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-testing
          format: spdx-json
          output-file: ~/warbler-${{ matrix.flavor }}-sbom.spdx.json

      - name: Upload SBOM
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: warbler-${{ matrix.flavor }}-sbom
          path: ~/warbler-${{ matrix.flavor }}-sbom.spdx.json
          retention-days: 30

      - name: Compute SBOM hash
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        id: hash
        run: |
          HASH=$(sha256sum ~/warbler-${{ matrix.flavor }}-sbom.spdx.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

  slsa-provenance:
    name: Attest SLSA provenance (${{ matrix.flavor }})
    needs: build
    if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(github.event.inputs.flavor == 'main' && '["main"]' || '["main", "nvidia", "gaming", "nvidia-gaming"]') }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: |
        ${{ format('{{"ghcr.io/huntedraven7/warbler:{0}-testing":"{1}"}}', matrix.flavor, needs.build.outputs.sbom_hash) }}
      provenance-name: warbler-${{ matrix.flavor }}-provenance

  trivy-scan:
    name: Trivy scan (${{ matrix.flavor }})
    needs: build
    runs-on: ubuntu-26.04
    if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(github.event.inputs.flavor == 'main' && '["main"]' || '["main", "nvidia", "gaming", "nvidia-gaming"]') }}
    steps:
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-09-19
        with:
          image-ref: 'ghcr.io/huntedraven7/warbler:${{ matrix.flavor }}-testing'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: 'trivy-results.sarif'

  iso:
    name: Build ISO (${{ github.event.inputs.flavor }})
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    if: ${{ github.event.inputs.iso == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Pull bootc-image-builder
        run: |
          podman pull quay.io/centos-bootc/bootc-image-builder:latest

      - name: Pull Warbler image for ISO
        run: |
          podman pull ghcr.io/huntedraven7/warbler:${{ github.event.inputs.flavor }}-testing
          IMAGE_REF="ghcr.io/huntedraven7/warbler:${{ github.event.inputs.flavor }}-testing"

      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p /tmp/iso-output
          podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v /tmp/iso-output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --output-dir /output \
            ${IMAGE_REF}

      - name: Verify ISO
        run: |
          ls -la /tmp/iso-output/
          ISO_FILE=$(find /tmp/iso-output -name "*.iso" | head -1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO file found"
            exit 1
          fi
          echo "ISO built: $ISO_FILE"
          echo "Size: $(du -h $ISO_FILE | cut -f1)"
          file $ISO_FILE
          echo "iso_path=$ISO_FILE" >> $GITHUB_OUTPUT
        id: iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iso-warbler-${{ github.event.inputs.flavor }}
          path: ${{ steps.iso.outputs.iso_path }}
          retention-days: 7

      - name: Push ISO artifact
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        run: |
          echo "ISO artifact available for download from workflow run"

  promote:
    name: Promote to stable
    needs: [build, trivy-scan]
    runs-on: ubuntu-26.04
    if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
    steps:
      - name: Promote testing -> stable
        run: |
          for flavor in main nvidia gaming nvidia-gaming; do
            podman pull ghcr.io/huntedraven7/warbler:${flavor}-testing
            podman tag ghcr.io/huntedraven7/warbler:${flavor}-testing ghcr.io/huntedraven7/warbler:${flavor}-stable
            podman push ghcr.io/huntedraven7/warbler:${flavor}-stable
          done

      - name: Verify promotion
        run: |
          for flavor in main nvidia gaming nvidia-gaming; do
            echo "Verifying ${flavor}-stable..."
            podman pull ghcr.io/huntedraven7/warbler:${flavor}-stable
            podman inspect ghcr.io/huntedraven7/warbler:${flavor}-stable --format '{{.Digest}}'
          done