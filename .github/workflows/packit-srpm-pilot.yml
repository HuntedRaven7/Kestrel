name: packit-srpm-pilot

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Specific package to build SRPM for (empty = all)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  validate-config:
    name: Validate .packit.yaml config
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate .packit.yaml vs upstream-sources.json
        run: |
          pip install pyyaml -q
          python3 pigeon/tools/validate_packit_config.py

  discover:
    name: Discover packages
    runs-on: ubuntu-26.04
    needs: validate-config
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Discover packages
        id: discover
        run: |
          python3 pigeon/tools/packit_workflow.py packages | tee /tmp/packages.json
          echo "packages=$(cat /tmp/packages.json)" >> $GITHUB_OUTPUT

  srpm:
    name: Build SRPM (${{ matrix.package }})
    needs: discover
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - name: Skip if specific package requested
        if: ${{ github.event.inputs.package != '' && github.event.inputs.package != matrix.package }}
        run: |
          echo "Skipping ${{ matrix.package }} (not requested)"
          echo "skipped=true" >> $GITHUB_OUTPUT
        id: skip_check

      - name: Checkout
        if: ${{ steps.skip_check.outputs.skipped != 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Identify vendored packages
        if: ${{ steps.skip_check.outputs.skipped != 'true' }}
        id: vendored
        run: |
          python3 << 'EOF'
          import json
          import sys
          import os
          try:
              with open('pigeon/config/upstream-sources.json') as f:
                  data = json.load(f)
              vendored = [name for name, entry in data['packages'].items() if entry.get('vendored')]
              result = json.dumps(vendored)
              print(f"Vendored packages detected: {vendored}")
          except Exception as e:
              # Always output valid JSON, even on error
              result = "[]"
              print(f"Error identifying vendored packages: {e}", file=sys.stderr)
          # Write to GITHUB_OUTPUT for step output
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"vendored={result}\n")
          EOF
        env:
          PYTHONIOENCODING: utf-8

      - name: Debug vendored output
        if: ${{ steps.skip_check.outputs.skipped != 'true' }}
        run: |
          echo "vendored output: '${{ steps.vendored.outputs.vendored }}'"
          echo "matrix package: '${{ matrix.package }}'"
          echo "contains check: ${{ contains(fromJson(steps.vendored.outputs.vendored), matrix.package) }}"

      - name: Install SRPM tooling (rpm2cpio/cpio for vendored fetch)
        if: ${{ steps.skip_check.outputs.skipped != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm cpio

      - name: Fetch vendored sources from Fedora (vendor + source tarballs)
        if: ${{ steps.skip_check.outputs.skipped != 'true' && contains(fromJson(steps.vendored.outputs.vendored), matrix.package) }}
        run: |
          echo "Fetching vendored sources for ${{ matrix.package }}"
          python3 pigeon/tools/fetch_vendored.py --package "${{ matrix.package }}"
        continue-on-error: false

      - name: Fetch and stage verified sources (all packages for source tarball)
        if: ${{ steps.skip_check.outputs.skipped != 'true' }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 pigeon/tools/source_pipeline.py fetch "$PACKAGE" \
            --output work/sources \
            --stage-into pigeon/packages
        continue-on-error: true

      - name: Stage extra dist-git sources (signatures, keys, etc.)
        if: ${{ steps.skip_check.outputs.skipped != 'true' }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 pigeon/tools/audit_sources.py --fix --package "$PACKAGE"

      # Fetch .sig for swayidle BEFORE packit build (packit downloads all SourceN)
      - name: Fetch swayidle signature from Fedora lookaside
        if: ${{ steps.skip_check.outputs.skipped != 'true' && matrix.package == 'swayidle' }}
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import re
          from pathlib import Path
          
          pkg = "swayidle"
          pkg_dir = Path("pigeon/packages") / pkg
          
          # Get hash from dist-git sources file
          sources_url = f"https://src.fedoraproject.org/rpms/{pkg}/raw/rawhide/f/sources"
          req = urllib.request.Request(sources_url, headers={"User-Agent": "kestrel-audit-sources/1"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              sources_text = resp.read().decode()
          
          sig_file = None
          for line in sources_text.splitlines():
              m = re.match(r"SHA512 \((\S+)\) = (\S+)", line)
              if m and m.group(1).endswith(".sig"):
                  sig_file = m.group(1)
                  sig_hash = m.group(2)
                  break
          
          if sig_file:
              lookaside_url = f"https://src.fedoraproject.org/repo/pkgs/{pkg}/{sig_file}/sha512/{sig_hash}/{sig_file}"
              print(f"Fetching {sig_file} from {lookaside_url}")
              req = urllib.request.Request(lookaside_url, headers={"User-Agent": "kestrel-audit-sources/1"})
              with urllib.request.urlopen(req, timeout=120) as resp, open(pkg_dir / sig_file, "wb") as f:
                  f.write(resp.read())
              print(f"Staged {sig_file}")
          else:
              print("No .sig file found in dist-git sources")
          EOF

      - name: Build SRPM with packit
        if: ${{ steps.skip_check.outputs.skipped != 'true' }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p work/srpm
          docker run --rm \
            -e PACKAGE \
            -v "$PWD:/repo:Z" \
            -v "$PWD/work/srpm:/out:Z" \
            -w /repo \
            quay.io/packit/packit@sha256:430bc0548547ab8d69b9e5dd91ad18a659d3abc45f256797a11263a2a7935fa2 \
            bash -exc '
              set -euo pipefail
              git config --global --add safe.directory "*"
              # grub2.spec needs with_legacy_arch from efi-srpm-macros at
              # parse time (real buildroots get it via BuildRequires).
              if [ "$PACKAGE" = grub2 ]; then dnf install -qy efi-srpm-macros; fi
              METHOD=$(python3 pigeon/tools/srpm_method.py "$PACKAGE")
              echo "Using SRPM method: $METHOD for $PACKAGE"
              if [ "$METHOD" = rpmbuild ]; then
                # Local file packages (no upstream archive) and specs
                # the packit parser cannot handle (grub2): plain rpmbuild
                # packs the spec + committed Sources directly. _sourcedir
                # must point at the recipe dir (rpmbuild defaults to ~/rpmbuild).
                SPEC=$(ls pigeon/packages/$PACKAGE/*.spec | head -1)
                echo "Building SRPM with rpmbuild for $PACKAGE"
                rpmbuild -bs --define "_srcrpmdir /out" \
                  --define "_sourcedir /repo/pigeon/packages/$PACKAGE" "$SPEC"
                # rpmbuild names the file NVR; the lane expects $PACKAGE.src.rpm.
                mv -f /out/*.src.rpm "/out/$PACKAGE.src.rpm"
              else
                echo "Building SRPM with packit for $PACKAGE"
                packit srpm --preserve-spec --output "/out/$PACKAGE.src.rpm" -p "$PACKAGE"
              fi
              echo "Verifying staged sources for $PACKAGE"
              python3 pigeon/tools/source_pipeline.py fetch "$PACKAGE" --verify-staged
              rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}\n" "/out/$PACKAGE.src.rpm"
            '
          # A build that produced no SRPM must fail here
          test -s "work/srpm/$PACKAGE.src.rpm"

      - name: Upload SRPM
        if: ${{ steps.skip_check.outputs.skipped != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: srpm-${{ matrix.package }}
          path: work/srpm/${{ matrix.package }}.src.rpm
          retention-days: 7

  verify-all:
    name: Verify all SRPMs generated
    needs: srpm
    runs-on: ubuntu-26.04
    if: always()
    steps:
      - name: Check all matrix jobs succeeded
        run: |
          echo "All SRPM builds completed"