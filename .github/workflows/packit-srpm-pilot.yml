name: packit-srpm-pilot

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Specific package to build SRPM for (empty = all)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Discover packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover packages
        id: discover
        run: |
          python3 pigeon/tools/packit_workflow.py packages | tee /tmp/packages.json
          echo "packages=$(cat /tmp/packages.json)" >> $GITHUB_OUTPUT

  srpm:
    name: Build SRPM (${{ matrix.package }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - name: Skip if specific package requested
        if: ${{ github.event.inputs.package != '' && github.event.inputs.package != matrix.package }}
        run: |
          echo "Skipping ${{ matrix.package }} (not requested)"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Pull Fedora 44 build container
        run: podman pull quay.io/fedora/fedora:44

      - name: Build SRPM in Fedora container
        id: build
        run: |
          podman run --rm \
            -v "$(pwd):/workspace:Z" \
            -w /workspace \
            quay.io/fedora/fedora:44 \
            bash -c "
              dnf install -y fedora-workstation-repositories &&
              printf '[hummingbird]\nname=Hummingbird Copr Repository\nbaseurl=https://copr.fedorainfracloud.org/coprs/hummingbird-community/bootc-os/repo/fedora-44/\$basearch/\nenabled=1\ngpgcheck=1\ngpgkey=https://copr.fedorainfracloud.org/coprs/hummingbird-community/bootc-os/key/gpgkey\nrepo_gpgcheck=0\npriority=10\n' > /etc/yum.repos.d/hummingbird.repo &&
              dnf install -y packit python3-pip &&
              cd pigeon/packages/${{ matrix.package }} &&
              packit srpm --preserve-spec --output ~/rpmbuild/SRPMS/ 2>&1 | tee /tmp/packit.log &&
              SRPM=\$(ls ~/rpmbuild/SRPMS/${{ matrix.package }}*.src.rpm 2>/dev/null | head -1) &&
              echo \"srpm_path=\$SRPM\" > /workspace/srpm_output.txt
            "
          # Read the SRPM path from the output file
          if [ -f srpm_output.txt ]; then
            SRPM_PATH=$(cat srpm_output.txt | cut -d= -f2)
            echo "srpm_path=$SRPM_PATH" >> $GITHUB_OUTPUT
            echo "Found SRPM: $SRPM_PATH"
          else
            echo "ERROR: No SRPM output file found"
            exit 1
          fi

      - name: Verify SRPM
        run: |
          rpm -qip ${{ steps.build.outputs.srpm_path }}
          rpm -qlp ${{ steps.build.outputs.srpm_path }}

      - name: Upload SRPM
        uses: actions/upload-artifact@v4
        with:
          name: srpm-${{ matrix.package }}
          path: ${{ steps.build.outputs.srpm_path }}
          retention-days: 7

  verify-all:
    name: Verify all SRPMs generated
    needs: srpm
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check all matrix jobs succeeded
        run: |
          echo "All SRPM builds completed"