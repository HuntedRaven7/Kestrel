name: drift-check

# Pins in upstream-sources.json extra_sources never fail a build when
# upstream moves — they just silently build old code. This schedule
# compares each commit pin against its tracked branch HEAD.
on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      package:
        description: "Specific package to check (empty = all)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  drift:
    name: Check upstream pin drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run drift check
        id: drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ github.event.inputs.package }}
        run: |
          # +e: record the tool's exit code as an output instead of
          # failing here, so the report always uploads first.
          set +e
          set -o pipefail
          ARGS=""
          if [ -n "$PACKAGE" ]; then ARGS="--package $PACKAGE"; fi
          python3 pigeon/tools/drift_check.py $ARGS --report drift-out | tee drift.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Publish report summary
        if: always()
        run: |
          if [ -f drift-out/drift-report.md ]; then
            cat drift-out/drift-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "drift check produced no report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drift-report
          path: |
            drift-out/drift-report.json
            drift-out/drift-report.md
            drift.log
          retention-days: 30

      - name: Fail on drift
        if: steps.drift.outputs.exit != '0'
        run: |
          echo "::error::Upstream pins drifted — review the drift report artifact"
          exit 1
