name: build-woodpecker

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to registry"
        required: false
        type: boolean
        default: false
      rpm_factory_image_sha:
        description: "Pinned rpm-factory OCI digest"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Woodpecker
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      sbom_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up podman
        run: |
          # The runner image's Google Chrome apt repo frequently desyncs
          # (Packages.gz size mismatch), failing the whole update. Nothing we
          # install comes from it, so drop it before updating.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify rpm-factory image signature
        env:
          RPM_FACTORY_IMAGE_SHA: ${{ inputs.rpm_factory_image_sha }}
        run: |
          set -euo pipefail
          [[ "$RPM_FACTORY_IMAGE_SHA" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign verify \
            "ghcr.io/huntedraven7/rpm-factory@$RPM_FACTORY_IMAGE_SHA" \
            --certificate-identity "https://github.com/HuntedRaven7/Kestrel/.github/workflows/rebuild-rpm-factory.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Build Woodpecker image
        env:
          RPM_FACTORY_IMAGE_SHA: ${{ inputs.rpm_factory_image_sha }}
        run: |
          if [[ ! "$RPM_FACTORY_IMAGE_SHA" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "rpm_factory_image_sha must be a full lowercase SHA-256 digest" >&2
            exit 1
          fi
          podman build -f woodpecker/Containerfile \
            --build-arg BASE_IMAGE=quay.io/hummingbird-community/bootc-os@sha256:TODO_BASE_IMAGE_SHA \
            --build-arg RPM_FACTORY_IMAGE=ghcr.io/huntedraven7/rpm-factory \
            --build-arg "RPM_FACTORY_IMAGE_SHA=$RPM_FACTORY_IMAGE_SHA" \
            --build-arg VERSION=testing \
            -t ghcr.io/huntedraven7/woodpecker:testing \
            woodpecker/.

      - name: Bootc lint
        run: |
          podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            ghcr.io/huntedraven7/woodpecker:testing \
            bootc container lint --fatal-warnings

      - name: Push image
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        run: |
          podman push ghcr.io/huntedraven7/woodpecker:testing
          # Also tag with digest for immutable reference
          digest=$(podman inspect ghcr.io/huntedraven7/woodpecker:testing --format '{{.Digest}}')
          podman tag ghcr.io/huntedraven7/woodpecker:testing ghcr.io/huntedraven7/woodpecker:${digest}
          podman push ghcr.io/huntedraven7/woodpecker:${digest}

      - name: Install cosign
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Cosign sign
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        run: |
          cosign sign --yes ghcr.io/huntedraven7/woodpecker:testing

      - name: Generate SBOM (syft)
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/huntedraven7/woodpecker:testing
          format: spdx-json
          output-file: ~/woodpecker-sbom.spdx.json

      - name: Upload SBOM
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: woodpecker-sbom
          path: ~/woodpecker-sbom.spdx.json
          retention-days: 30

      - name: Compute SBOM hash
        if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
        id: hash
        run: |
          HASH=$(sha256sum ~/woodpecker-sbom.spdx.json | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

  slsa-provenance:
    name: Attest SLSA provenance
    needs: build
    if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: |
        ${{ format('{{"ghcr.io/huntedraven7/woodpecker:testing":"{0}"}}', needs.build.outputs.sbom_hash) }}
      provenance-name: woodpecker-provenance

  trivy-scan:
    name: Trivy scan
    needs: build
    runs-on: ubuntu-26.04
    if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
    steps:
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-09-19
        with:
          image-ref: 'ghcr.io/huntedraven7/woodpecker:testing'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: 'trivy-results.sarif'

  promote:
    name: Promote to stable
    needs: [build, trivy-scan]
    runs-on: ubuntu-26.04
    if: ${{ github.event.inputs.push == true && github.ref == 'refs/heads/main' }}
    steps:
      - name: Promote testing -> stable
        run: |
          podman pull ghcr.io/huntedraven7/woodpecker:testing
          podman tag ghcr.io/huntedraven7/woodpecker:testing ghcr.io/huntedraven7/woodpecker:stable
          podman push ghcr.io/huntedraven7/woodpecker:stable

      - name: Verify promotion
        run: |
          podman pull ghcr.io/huntedraven7/woodpecker:stable
          podman inspect ghcr.io/huntedraven7/woodpecker:stable --format '{{.Digest}}'