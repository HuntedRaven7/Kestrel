name: rebuild-pigeon

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        type: boolean
        description: "Force full rebuild of all stages"
        required: false
        default: false
      stage:
        type: string
        description: "Single stage to build (0-4), empty for all"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Prepare build plan
    runs-on: ubuntu-26.04
    outputs:
      matrix0: ${{ steps.plan.outputs.matrix0 }}
      matrix1: ${{ steps.plan.outputs.matrix1 }}
      matrix2: ${{ steps.plan.outputs.matrix2 }}
      matrix3: ${{ steps.plan.outputs.matrix3 }}
      matrix4: ${{ steps.plan.outputs.matrix4 }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine changed packages
        id: plan
        run: |
          python3 << 'EOF'
          import json
          import os
          import subprocess
          import sys

          # Buildable packages (recipe dir + spec on disk).
          result = subprocess.run(
              [sys.executable, "pigeon/tools/packit_workflow.py", "packages"],
              capture_output=True, text=True, check=True,
          )
          buildable = sorted(json.loads(result.stdout.strip()))
          lock = json.loads(
              open("pigeon/config/upstream-sources.json").read())["packages"]

          # Group by the lock `stage` field (0-4 today); optional manual
          # single-stage filter. Membership is data-driven so deleted or
          # not-yet-written recipes can never desync this workflow.
          stage_filter = "${{ github.event.inputs.stage }}"
          stages = {}
          for name in buildable:
              stage = str(lock.get(name, {}).get("stage", "2"))
              if stage_filter and stage != stage_filter:
                  continue
              stages.setdefault(stage, []).append({"package": name})

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for n in ("0", "1", "2", "3", "4"):
                  f.write(f"matrix{n}={json.dumps(stages.get(n, []))}\n")
              f.write(f"changed={json.dumps([{'package': p} for p in buildable])}\n")
          EOF

  preflight:
    name: Preflight BuildRequires check
    runs-on: ubuntu-26.04
    needs: prepare
    if: ${{ needs.prepare.outputs.changed != '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Pull Fedora 44 build container
        # NOTE: tag pin, not digest — see build-stage.yml (quay prunes old
        # fedora:44 manifests, digest pins rot into pull failures).
        run: podman pull quay.io/fedora/fedora:44

      - name: Advisory BuildRequires resolution
        run: |
          python3 << 'EOF'
          import subprocess
          import sys
          
          result = subprocess.run([sys.executable, "pigeon/tools/packit_workflow.py", "packages"], 
                                capture_output=True, text=True)
          packages = [p for p in result.stdout.strip().split('\n') if p]
          
          for pkg in packages:
              print(f"Checking {pkg}...")
              try:
                  subprocess.run([
                      "podman", "run", "--rm",
                      "-v", f"$(pwd)/pigeon/packages/{pkg}:/spec:Z",
                      "-v", "$(pwd)/pigeon/config/upstream-sources.json:/sources.json:Z",
                      "quay.io/fedora/fedora:44",
                      "bash", "-c",
                      "dnf install -y fedora-workstation-repositories && "
                      "printf '[hummingbird]\\nname=Hummingbird public\\nbaseurl=https://koji-s3-cache.hummingbird-project.io/packages.redhat.com/api/pulp-content/public-hummingbird/x86_64/\\nenabled=1\\ngpgcheck=0\\nexclude=ruby* rubygem*\\n' > /etc/yum.repos.d/hummingbird.repo && "
                      "dnf builddep -y /spec/*.spec 2>&1 | tail -20 || true"
                  ], check=False)
              except Exception as e:
                  print(f"Preflight warning for {pkg} (continuing): {e}")
          EOF
        continue-on-error: true

  srpm:
    name: Build SRPMs (fail-fast)
    # Spec + source errors surface here in ~1 min per package instead of
    # hiding behind serial stage builds and 10-minute compiles. Every
    # rebuild wave waits on this job. The SRPM build itself lives in the
    # reusable srpm.yml workflow so the wave can run independently (e.g.
    # from packit-srpm-pilot) without dragging the rebuild matrix with it.
    # Mandatory after preflight: the BuildRequires advisory check gates the
    # SRPM wave so broken specs never reach rpmbuild -bs.
    needs: [prepare, preflight]
    if: ${{ needs.prepare.outputs.changed != '[]' }}
    uses: ./.github/workflows/srpm.yml
    with:
      packages: ${{ needs.prepare.outputs.changed }}

  rebuild0:
    name: Build Stage 0
    needs: [prepare, preflight, srpm]
    if: ${{ needs.prepare.outputs.matrix0 != '' && needs.prepare.outputs.matrix0 != '[]' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: "0"
      packages: ${{ needs.prepare.outputs.matrix0 }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebuild1:
    name: Build Stage 1
    needs: [prepare, preflight, rebuild0]
    if: ${{ needs.prepare.outputs.matrix1 != '' && needs.prepare.outputs.matrix1 != '[]' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: "1"
      packages: ${{ needs.prepare.outputs.matrix1 }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebuild2:
    name: Build Stage 2
    needs: [prepare, preflight, rebuild1]
    if: ${{ needs.prepare.outputs.matrix2 != '' && needs.prepare.outputs.matrix2 != '[]' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: "2"
      packages: ${{ needs.prepare.outputs.matrix2 }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebuild3:
    name: Build Stage 3
    needs: [prepare, preflight, rebuild2]
    if: ${{ needs.prepare.outputs.matrix3 != '' && needs.prepare.outputs.matrix3 != '[]' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: "3"
      packages: ${{ needs.prepare.outputs.matrix3 }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebuild4:
    name: Build Stage 4
    needs: [prepare, preflight, rebuild3]
    if: ${{ needs.prepare.outputs.matrix4 != '' && needs.prepare.outputs.matrix4 != '[]' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: "4"
      packages: ${{ needs.prepare.outputs.matrix4 }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  precedence:
    name: Precedence check
    runs-on: ubuntu-26.04
    needs: [prepare, rebuild0, rebuild1, rebuild2, rebuild3, rebuild4]
    if: ${{ always() && needs.prepare.outputs.changed != '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download all stage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: stage-*
          path: ~/stages
          merge-multiple: true
        continue-on-error: true

      - name: Check if artifacts exist
        id: artifacts
        run: |
          if [ -d ~/stages ] && [ -n "$(ls -A ~/stages 2>/dev/null)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run precedence check
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        run: |
          python3 pigeon/tools/publish_gate.py \
            --repo-root ~/stages \
            --base-image quay.io/hummingbird-community/bootc-os:latest \
            --pigeon-suffix .hum1.pigeon

      - name: Skip precedence check (no artifacts)
        if: ${{ steps.artifacts.outputs.exists == 'false' }}
        run: |
          echo "No stage artifacts found, skipping precedence check"

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-26.04
    needs: [prepare, precedence]
    if: ${{ github.ref == 'refs/heads/main' && needs.precedence.result == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      repomd_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download all stage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: stage-*
          path: ~/stages
          merge-multiple: true
        continue-on-error: true

      - name: Check if artifacts exist
        id: artifacts
        run: |
          if [ -d ~/stages ] && [ -n "$(ls -A ~/stages 2>/dev/null)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create repository structure
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        run: |
          mkdir -p ~/repository
          # Must match every stage dispatched above (test_publish_collects_all_stages).
          for stage in 0 1 2 3 4; do
            if [ -d ~/stages/stage-$stage ]; then
              cp -r ~/stages/stage-$stage/* ~/repository/ 2>/dev/null || true
            fi
          done

      - name: Create repodata
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        run: |
          cd ~/repository
          createrepo_c .

      - name: Install cosign
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign repomd.xml (keyless cosign)
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        run: |
          cosign sign-blob --yes \
            --output-signature ~/repository/repodata/repomd.xml.sig \
            ~/repository/repodata/repomd.xml

      - name: Build and push OCI image
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        run: |
          cat > ~/Dockerfile.publish << 'EOF'
          FROM scratch
          COPY repository /repository
          LABEL org.opencontainers.image.title="Pigeon RPM Repository"
          LABEL org.opencontainers.image.description="Kestrel Pigeon package factory repository"
          LABEL org.opencontainers.image.source="https://github.com/HuntedRaven7/Kestrel"
          EOF
          podman build -f ~/Dockerfile.publish -t ghcr.io/huntedraven7/pigeon:latest ~/.
          podman push ghcr.io/huntedraven7/pigeon:latest

      - name: Generate SBOM (syft)
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/huntedraven7/pigeon:latest
          format: spdx-json
          output-file: ~/pigeon-sbom.spdx.json

      - name: Upload SBOM as artifact
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pigeon-sbom
          path: ~/pigeon-sbom.spdx.json
          retention-days: 30

      - name: Compute repomd.xml hash
        if: ${{ steps.artifacts.outputs.exists == 'true' }}
        id: hash
        run: |
          HASH=$(sha256sum ~/repository/repodata/repomd.xml | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Skip publish (no artifacts)
        if: ${{ steps.artifacts.outputs.exists == 'false' }}
        run: |
          echo "No stage artifacts found, skipping publish"

  slsa-provenance:
    name: Attest SLSA provenance
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && needs.publish.outputs.repomd_hash != '' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: |
        ${{ format('{{"ghcr.io/huntedraven7/pigeon:latest":"{0}"}}', needs.publish.outputs.repomd_hash) }}
      provenance-name: pigeon-provenance

  trivy-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-26.04
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && needs.publish.outputs.repomd_hash != '' }}
    steps:
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master 2026-09-19
        with:
          image-ref: 'ghcr.io/huntedraven7/pigeon:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: 'trivy-results.sarif'