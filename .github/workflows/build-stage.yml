name: build-stage (reusable wave)

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      packages:
        required: true
        type: string
    secrets:
      GHCR_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman rpm cpio

      - name: Pull Fedora 44 build container
        # NOTE: deliberately pinned by tag, not digest. fedora:44 moves
        # fast and quay.io prunes old manifests within days, so a digest
        # pin rots into "manifest unknown" pull failures (exit 125).
        run: podman pull quay.io/fedora/fedora:44

      - name: Compute dnf cache key
        id: week
        run: |
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore shared dnf cache
        # Seeded weekly by seed-dnf-cache.yml (single writer). A miss or
        # corrupt entry just means a cold builddep; never fatal.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: work/dnf-cache
          key: pigeon-dnf-f44-${{ steps.week.outputs.week }}
          restore-keys: |
            pigeon-dnf-f44-

      - name: Stage all sources for this package
        uses: ./.github/actions/stage-sources
        with:
          package: ${{ matrix.package }}

      - name: Download prior-stage RPMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/download-artifact flakes against the artifact backend
          # (HTTP 403 from the intermediary mid-listing), and it has no
          # retry of its own, so fetch with gh and a bounded retry instead.
          # Semantics match the old merge-multiple step: every matching
          # artifact's RPMs land flat in work/prior. Tolerant by design (see
          # continue-on-error): an early stage simply has no priors yet.
          # Backoff is exponential with jitter: bursts of matrix jobs share
          # one API rate limit, so hammering a 403 makes it worse. Rate-limit
          # errors are not retried at all: the budget will not clear while
          # sibling jobs keep spending it, so fail fast and let the build
          # either pass on Fedora fallbacks or fail loudly at rpmbuild.
          mkdir -p work/prior
          tmpdir=$(mktemp -d)
          delay=15
          for attempt in 1 2 3 4 5; do
            rm -rf "$tmpdir"
            mkdir -p "$tmpdir"
            if err=$(gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern 'stage-*' --dir "$tmpdir" 2>&1); then
              find "$tmpdir" -name '*.rpm' -exec cp -t work/prior/ {} +
              break
            elif echo "$err" | grep -qi "no artifact matches"; then
              break
            elif echo "$err" | grep -qi "rate limit"; then
              echo "::warning title=artifact download rate limited::priors unavailable, continuing without them"
              break
            fi
            echo "::warning title=artifact download retry::attempt $attempt failed, waiting ${delay}s before retry"
            sleep $delay
            delay=$((delay * 2 + RANDOM % 10))
          done
          rm -rf "$tmpdir"
        continue-on-error: true

      - name: Resolve build root for cache key
        # A cache key includes the root dnf actually resolved. Resolve it
        # before asking GHCR so a hit cannot cross a build-root boundary.
        # This is cheap beside an RPM compile; a hit skips it entirely.
        # Best-effort: an empty key disables caching, never the build.
        id: package_cache
        run: |
          mkdir -p work/cache
          # Shared dnf cache: the resolve step below and the build step
          # each run a fresh container, so without this bind-mount every
          # job would download its full builddep set twice.
          mkdir -p work/dnf-cache
          BUILDROOT_DIGEST=$(podman inspect quay.io/fedora/fedora:44 --format '{{.Digest}}' 2>/dev/null || true)
          if [ -z "$BUILDROOT_DIGEST" ]; then
            echo "could not resolve buildroot digest, caching disabled"
            echo "key=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p work/prior
          if ! podman run --rm \
            -v "$PWD:/repo:Z" \
            -v "$PWD/work/prior:/prior:Z" \
            -v "$PWD/work/cache:/cache:Z" \
            -v "$PWD/work/dnf-cache:/var/cache/libdnf5:Z" \
            -e PACKAGE="${{ matrix.package }}" \
            quay.io/fedora/fedora:44 \
            bash -exc '
              dnf install -qy dnf-plugins-core createrepo_c
              # Retain downloaded RPMs in the shared cache mount so the
              # build step below reuses them instead of re-downloading.
              printf "\nkeepcache=1\n" >> /etc/dnf/dnf.conf
              printf "[hummingbird]\nname=Hummingbird public\nbaseurl=https://koji-s3-cache.hummingbird-project.io/packages.redhat.com/api/pulp-content/public-hummingbird/x86_64/\nenabled=1\ngpgcheck=0\nexclude=ruby* rubygem*\n" \
                > /etc/yum.repos.d/hummingbird.repo
              if [ -n "$(find /prior -name "*.rpm" | head -1)" ]; then
                createrepo_c /prior
                printf "[pigeon-prior]\nname=pigeon-prior\nbaseurl=file:///prior\nenabled=1\ngpgcheck=0\n" \
                  > /etc/yum.repos.d/pigeon-prior.repo
              fi
              SPEC=$(ls /repo/pigeon/packages/$PACKAGE/*.spec | head -1)
              cp "$SPEC" /tmp/pkg.spec
              dnf builddep -y --skip-unavailable /tmp/pkg.spec 2>&1 || \
                echo "WARNING: builddep failed for $PACKAGE, continuing with available deps"
              dnf install -qy rpm-build meson ninja-build gcc gcc-c++ make pkgconfig \
                python3 2>&1 || true
              rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n" | sort -u > /cache/root
            ' > work/cache/resolve.log 2>&1; then
            echo "build root resolution failed, caching disabled"
            echo "key=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEY=$(python3 pigeon/tools/package_cache_key.py "${{ matrix.package }}" \
            --buildroot-digest "$BUILDROOT_DIGEST" \
            --disttag .hum1.pigeon \
            --resolved-root work/cache/root) || KEY=""
          if [ -n "$KEY" ]; then echo "cache key: $KEY"; fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore package RPM cache
        id: package_cache_restore
        if: steps.package_cache.outputs.key != ''
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          KEY: ${{ steps.package_cache.outputs.key }}
        run: |
          set -euo pipefail
          image="ghcr.io/huntedraven7/pigeon-cache:$KEY"
          if ! echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning title=package cache unavailable::could not authenticate to GHCR"
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if podman pull "$image"; then
            container=$(podman create "$image" /bin/true)
            mkdir -p work/result
            podman cp "$container:/rpms/." work/result/
            podman rm "$container"
            if [ -n "$(find work/result -name '*.rpm' -print -quit)" ]; then
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "cache hit: $KEY"
            else
              # A stored entry with no RPMs must never ship: drop it and
              # fall through to a real build rather than failing the job.
              echo "::warning title=package cache entry empty::rebuilding $KEY from source"
              rm -rf work/result
              echo "hit=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "cache miss: $KEY"
          fi

      - name: Use cached RPMs
        if: steps.package_cache_restore.outputs.hit == 'true'
        run: |
          mkdir -p work/out
          cp work/result/*.rpm work/out/
          echo "reusing $(ls work/out/*.rpm | wc -l) cached RPMs for ${{ matrix.package }}"

      - name: Build in Fedora container
        if: steps.package_cache_restore.outputs.hit != 'true'
        run: |
          # Bind-mount sources must exist even when empty (stage 0 has no priors).
          mkdir -p work/prior work/out work/dnf-cache
          podman run --rm \
            -v "$PWD:/repo:Z" \
            -v "$PWD/work/src:/src:Z" \
            -v "$PWD/work/prior:/prior:Z" \
            -v "$PWD/work/out:/out:Z" \
            -v "$PWD/work/dnf-cache:/var/cache/libdnf5:Z" \
            -e PACKAGE="${{ matrix.package }}" \
            quay.io/fedora/fedora:44 \
            bash -exc '
              dnf install -qy dnf-plugins-core rpm-build createrepo_c python3 git
              # Same shared cache mount as the resolve step (see above).
              printf "\nkeepcache=1\n" >> /etc/dnf/dnf.conf
              # The fedora image sets tsflags=nodocs, which skips %doc files
              # at install time. Rust registry crates flag their READMEs as
              # doc, and crates that include_str! them (e.g. bitvec via
              # pydantic-core) then fail to compile with a missing-file
              # error that looks nothing like packaging. Mock and koji do
              # not set nodocs, so builds that pass there fail here without
              # this. An empty value clears the inherited flag.
              printf "\ntsflags=\n" >> /etc/dnf/dnf.conf
              # Hummingbird overlay repo. NOTE: the old Copr URL is dead;
              # the live yum repo is the pulp-content endpoint below.
              # gpgcheck=0: no signing key is published for it (revisit).
              # exclude=ruby*: Hummingbird ships ruby3.3+ruby3.4 stacks that
              # file-conflict with each other and Fedora ruby 4.0 during
              # builddep; our builds do not need Hummingbird ruby, so
              # resolve the whole ruby subtree from Fedora coherently.
              printf "[hummingbird]\nname=Hummingbird public\nbaseurl=https://koji-s3-cache.hummingbird-project.io/packages.redhat.com/api/pulp-content/public-hummingbird/x86_64/\nenabled=1\ngpgcheck=0\nexclude=ruby* rubygem*\n" \
                > /etc/yum.repos.d/hummingbird.repo
              # Prior waves as a local repo (empty on stage 0).
              if [ -n "$(find /prior -name "*.rpm" | head -1)" ]; then
                createrepo_c /prior
                printf "[pigeon-prior]\nname=pigeon-prior\nbaseurl=file:///prior\nenabled=1\ngpgcheck=0\n" \
                  > /etc/yum.repos.d/pigeon-prior.repo
              fi
              SPEC=$(ls /repo/pigeon/packages/$PACKAGE/*.spec | head -1)
              cp "$SPEC" /tmp/pkg.spec
              export RPMBUILD=/root/rpmbuild
              mkdir -p "$RPMBUILD"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              # Copy committed recipe inputs (patches, .sig/keys, sysusers units,
              # vendor trees, macros) into SOURCES before builddep so that
              # dnf can resolve SourceN references that require local files.
              cp /src/* "$RPMBUILD/SOURCES/" 2>/dev/null || true
              cp /repo/pigeon/packages/$PACKAGE/* "$RPMBUILD/SOURCES/" 2>/dev/null || true
              cp "$SPEC" "$RPMBUILD/SPECS/$(basename $SPEC)"
              # Try builddep; if it fails due to missing pigeon-prior packages,
              # retry with --skip-unavailable so missing inter-package deps
              # (e.g. wireplumber needs pipewire-0.3.pc from our pipewire build)
              # do not block the entire stage. Packages that fail to resolve
              # will simply be skipped; the build may fail if they are critical.
              dnf builddep -y --skip-unavailable /tmp/pkg.spec 2>&1 || \
                echo "WARNING: builddep failed for $PACKAGE, continuing with available deps"
              # Ensure core build tools are present even if builddep skipped them
              dnf install -qy rpm-build meson ninja-build gcc gcc-c++ make pkgconfig \
                python3 2>&1 || true
              # Keep the real spec filename: later steps address it by
              # $(basename $SPEC), and a bare cp would leave pkg.spec.
              # Packages with generate_buildrequires (Rust crates, pyproject
              # packages) compute their real BuildRequires during the build,
              # so a single rpmbuild -br exits 11 asking to be re-run.
              # Install what the generated .buildreqs.nosrc.rpm declares and
              # retry, bounded so an unsatisfiable requirement fails closed
              # instead of looping forever.
              for _ in 1 2 3 4 5; do
                rm -f "$RPMBUILD"/SRPMS/*.buildreqs.nosrc.rpm
                if rpmbuild -br "$RPMBUILD/SPECS/$(basename $SPEC)" \
                  --define "_topdir $RPMBUILD"; then break; fi
                GENERATED=$(ls "$RPMBUILD"/SRPMS/*.buildreqs.nosrc.rpm 2>/dev/null | head -1)
                test -n "$GENERATED"
                dnf builddep -y "$GENERATED"
              done
              rpmbuild -ba "$RPMBUILD/SPECS/$(basename $SPEC)" \
                --define "_topdir $RPMBUILD" \
                --define "dist .hum1.pigeon"
              cp "$RPMBUILD"/RPMS/*/*.rpm /out/ 2>/dev/null || true
              cp "$RPMBUILD"/SRPMS/*.src.rpm /out/ 2>/dev/null || true
            '

      - name: Collect artifacts
        run: |
          mkdir -p ~/stages/${{ inputs.stage }}/${{ matrix.package }}
          cp work/out/*.rpm ~/stages/${{ inputs.stage }}/${{ matrix.package }}/ 2>/dev/null || true
          test -n "$(ls ~/stages/${{ inputs.stage }}/${{ matrix.package }}/ 2>/dev/null)" \
            || echo "WARNING: no RPMs produced for ${{ matrix.package }}"

      - name: Upload stage artifacts
        # actions/upload-artifact flakes against the artifact backend
        # (HTTP 403 from the intermediary at finalize time) and has no
        # retry of its own, so run it through a bounded retry wrapper.
        # Failing closed after 5 attempts: a green build with missing
        # artifacts is worse than a red one.
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
          attempt_limit: 5
          attempt_delay: 15000
          with: |
            name: stage-${{ inputs.stage }}-${{ matrix.package }}
            path: ~/stages/${{ inputs.stage }}/${{ matrix.package }}/
            retention-days: 7

      - name: Publish package RPM cache
        if: success() && steps.package_cache.outputs.key != '' && steps.package_cache_restore.outputs.hit != 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          KEY: ${{ steps.package_cache.outputs.key }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          mkdir -p work/result
          cp work/out/*.rpm work/result/ 2>/dev/null || true
          # Refuse to publish an empty entry: a hit ships whatever is
          # stored, so an empty cache would silently drop the package.
          if [ -z "$(find work/result -name '*.rpm' -print -quit)" ]; then
            echo "::error::no RPMs built for $PACKAGE, refusing to publish an empty cache entry"
            exit 1
          fi
          image="ghcr.io/huntedraven7/pigeon-cache:$KEY"
          NEVR=$(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}' work/result/*.src.rpm 2>/dev/null | head -1 || true)
          if [ -z "$NEVR" ]; then
            NEVR=$(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}' work/result/*.rpm 2>/dev/null | head -1 || true)
          fi
          printf 'FROM scratch\nCOPY work/result /rpms\n' > Containerfile.package-cache
          if ! echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning title=package cache unavailable::could not authenticate to GHCR"
            exit 0
          fi
          podman build \
            --label org.opencontainers.image.title="$PACKAGE" \
            --label org.opencontainers.image.version="$NEVR" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.kestrel.pigeon.disttag=".hum1.pigeon" \
            --tag "$image" --file Containerfile.package-cache . \
            && podman push "$image" \
            || echo "::warning title=package cache publish failed::the build artifact remains valid; a later run will rebuild this package"
