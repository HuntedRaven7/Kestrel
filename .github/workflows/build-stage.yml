name: build-stage (reusable wave)

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      packages:
        required: true
        type: string
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman rpm cpio

      - name: Pull Fedora 44 build container
        # NOTE: deliberately pinned by tag, not digest. fedora:44 moves
        # fast and quay.io prunes old manifests within days, so a digest
        # pin rots into "manifest unknown" pull failures (exit 125).
        run: podman pull quay.io/fedora/fedora:44

      - name: Fetch verified source for this package
        run: |
          mkdir -p work/src
          python3 pigeon/tools/source_pipeline.py fetch "${{ matrix.package }}" \
            --output work/src --stage-into pigeon/packages

      - name: Stage vendored and secondary sources
        # source_pipeline.py only stages the primary Source0 archive, but
        # rpmbuild needs every Source/Patch present: Go vendor trees
        # (runc/containerd/tailscale via Koji SRPM, bootc via release
        # tarball) and any dist-git sidecar audit --fix can fetch.
        run: |
          PKG="${{ matrix.package }}"
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('pigeon/config/upstream-sources.json'))['packages']['$PKG'].get('vendored') else 1)"; then
            echo "Fetching vendored sources for $PKG"
            python3 pigeon/tools/fetch_vendored.py --package "$PKG"
          fi
          if [ "$PKG" = bootc ]; then
            VER=$(python3 -c "import json; print(json.load(open('pigeon/config/upstream-sources.json'))['packages']['bootc']['version'])")
            curl -fsSL --retry 3 \
              -o "pigeon/packages/bootc/bootc-${VER}-vendor.tar.zstd" \
              "https://github.com/bootc-dev/bootc/releases/download/v${VER}/bootc-${VER}-vendor.tar.zstd"
          fi
          python3 pigeon/tools/audit_sources.py --fix --package "$PKG"

      - name: Alias staged source under spec Source0 names
        # Fedora specs reference lookaside-renamed tarballs while upstream
        # URLs serve tag-named files (libblockdev-3.5.0.tar.gz vs 3.5.0.tar.gz).
        # The packit lane bridges this positionally; raw rpmbuild needs the
        # spec's basename present, so link it to the verified staged archive.
        run: |
          if [ -n "$(ls work/src 2>/dev/null)" ]; then
            SPEC=$(ls pigeon/packages/${{ matrix.package }}/*.spec | head -1)
            STAGED=$(ls work/src/* | head -1)
            python3 pigeon/tools/spec_source_alias.py --spec "$SPEC" \
              --sources work/src --staged "$STAGED" \
              --recipe-dir "pigeon/packages/${{ matrix.package }}"
          else
            echo "no staged source (local package?), skipping aliases"
          fi

      - name: Download prior-stage RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Earlier waves (and any already-finished same-wave jobs).
          # Later waves cannot exist yet: the caller serializes stages
          # via needs. Empty on stage 0.
          pattern: stage-*
          path: work/prior
          merge-multiple: true
        continue-on-error: true

      - name: Build in Fedora container
        run: |
          # Bind-mount sources must exist even when empty (stage 0 has no priors).
          mkdir -p work/prior work/out
          podman run --rm \
            -v "$PWD:/repo:Z" \
            -v "$PWD/work/src:/src:Z" \
            -v "$PWD/work/prior:/prior:Z" \
            -v "$PWD/work/out:/out:Z" \
            -e PACKAGE="${{ matrix.package }}" \
            quay.io/fedora/fedora:44 \
            bash -exc '
              dnf install -qy dnf-plugins-core rpm-build createrepo_c python3 git
              # Hummingbird overlay repo. NOTE: the old Copr URL is dead;
              # the live yum repo is the pulp-content endpoint below.
              # gpgcheck=0: no signing key is published for it (revisit).
              # exclude=ruby*: Hummingbird ships ruby3.3+ruby3.4 stacks that
              # file-conflict with each other and Fedora ruby 4.0 during
              # builddep; our builds do not need Hummingbird ruby, so
              # resolve the whole ruby subtree from Fedora coherently.
              printf "[hummingbird]\nname=Hummingbird public\nbaseurl=https://koji-s3-cache.hummingbird-project.io/packages.redhat.com/api/pulp-content/public-hummingbird/x86_64/\nenabled=1\ngpgcheck=0\nexclude=ruby* rubygem*\n" \
                > /etc/yum.repos.d/hummingbird.repo
              # Prior waves as a local repo (empty on stage 0).
              if [ -n "$(find /prior -name "*.rpm" | head -1)" ]; then
                createrepo_c /prior
                printf "[pigeon-prior]\nname=pigeon-prior\nbaseurl=file:///prior\nenabled=1\ngpgcheck=0\n" \
                  > /etc/yum.repos.d/pigeon-prior.repo
              fi
              SPEC=$(ls /repo/pigeon/packages/$PACKAGE/*.spec | head -1)
              cp "$SPEC" /tmp/pkg.spec
              dnf builddep -y /tmp/pkg.spec
              export RPMBUILD=/root/rpmbuild
              mkdir -p "$RPMBUILD"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              # Keep the real spec filename: later steps address it by
              # $(basename $SPEC), and a bare cp would leave pkg.spec.
              cp /tmp/pkg.spec "$RPMBUILD/SPECS/$(basename $SPEC)"
              # Verified archive plus every committed recipe input
              # (patches, .sig/keys, sysusers units, vendor trees).
              cp /src/* "$RPMBUILD/SOURCES/" 2>/dev/null || true
              cp /repo/pigeon/packages/$PACKAGE/* "$RPMBUILD/SOURCES/" 2>/dev/null || true
              rpmbuild -br "$RPMBUILD/SPECS/$(basename $SPEC)" \
                --define "_topdir $RPMBUILD"
              rpmbuild -ba "$RPMBUILD/SPECS/$(basename $SPEC)" \
                --define "_topdir $RPMBUILD" \
                --define "dist .hum1.pigeon"
              cp "$RPMBUILD"/RPMS/*/*.rpm /out/ 2>/dev/null || true
              cp "$RPMBUILD"/SRPMS/*.src.rpm /out/ 2>/dev/null || true
            '

      - name: Collect artifacts
        run: |
          mkdir -p ~/stages/${{ inputs.stage }}/${{ matrix.package }}
          cp work/out/*.rpm ~/stages/${{ inputs.stage }}/${{ matrix.package }}/ 2>/dev/null || true
          test -n "$(ls ~/stages/${{ inputs.stage }}/${{ matrix.package }}/ 2>/dev/null)" \
            || echo "WARNING: no RPMs produced for ${{ matrix.package }}"

      - name: Upload stage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage-${{ inputs.stage }}-${{ matrix.package }}
          path: ~/stages/${{ inputs.stage }}/${{ matrix.package }}/
          retention-days: 7
