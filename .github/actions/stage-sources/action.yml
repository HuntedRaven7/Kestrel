name: stage-sources
description: >
  Stage every source rpmbuild needs for one package: Go vendor trees and
  dist-git sidecars, the verified primary archive, and Source0-name
  aliases. Shared by build-stage.yml and the rebuild-pigeon SRPM wave so
  the two can never disagree on what "all sources present" means.

inputs:
  package:
    description: Package name (recipe dir under pigeon/packages)
    required: true

runs:
  using: composite
  steps:
    - name: Stage vendored and secondary sources
      shell: bash
      run: |
        # source_pipeline.py only stages the primary Source0 archive, but
        # rpmbuild needs every Source/Patch present: Go vendor trees
        # (runc/containerd/tailscale via Koji SRPM) and any dist-git
        # sidecar audit --fix can fetch.
        # For vendored packages, fetch_vendored.py must run BEFORE
        # source_pipeline.py fetch since the latter validates the source
        # tarball is present.
        PKG="${{ inputs.package }}"
        if python3 -c "import json,sys; sys.exit(0 if json.load(open('pigeon/config/upstream-sources.json'))['packages']['$PKG'].get('vendored') else 1)"; then
          echo "Fetching vendored sources for $PKG"
          python3 pigeon/tools/fetch_vendored.py --package "$PKG"
        fi
        python3 pigeon/tools/audit_sources.py --fix --package "$PKG"

    - name: Fetch verified source for this package
      shell: bash
      run: |
        mkdir -p work/src
        python3 pigeon/tools/source_pipeline.py fetch "${{ inputs.package }}" \
          --output work/src --stage-into pigeon/packages

    - name: Copy or generate local package sources
      shell: bash
      run: |
        # For local packages (source generated locally), copy the source file to work/src
        # or generate it if a generator script (strip.py) exists.
        PKG="${{ inputs.package }}"
        if python3 -c "import json,sys; sys.exit(0 if json.load(open('pigeon/config/upstream-sources.json'))['packages']['$PKG'].get('local') else 1)"; then
          FILE=$(python3 -c "import json; d=json.load(open('pigeon/config/upstream-sources.json')); print(d['packages']['$PKG'].get('filename', ''))")
          RECIPE_DIR="pigeon/packages/$PKG"
          if [ -n "$FILE" ] && [ -f "$RECIPE_DIR/$FILE" ]; then
            cp "$RECIPE_DIR/$FILE" work/src/
            echo "Copied local source $FILE to work/src"
          elif [ -f "$RECIPE_DIR/strip.py" ]; then
            echo "Generating local source for $PKG using strip.py..."
            (cd "$RECIPE_DIR" && python3 strip.py)
            if [ -f "$FILE" ]; then
              cp "$FILE" work/src/
              echo "Generated and copied $FILE to work/src"
            else
              echo "ERROR: strip.py did not produce $FILE"
              exit 1
            fi
          else
            echo "WARNING: local package $PKG has no source file and no strip.py generator"
          fi
        fi

    - name: Alias staged source under spec Source0 names
      shell: bash
      run: |
        # Fedora specs reference lookaside-renamed tarballs while upstream
        # URLs serve tag-named files (libblockdev-3.5.0.tar.gz vs 3.5.0.tar.gz).
        # Raw rpmbuild needs the spec basename present, so link it to the
        # verified staged archive.
        if [ -n "$(ls work/src 2>/dev/null)" ]; then
          SPEC=$(ls pigeon/packages/${{ inputs.package }}/*.spec | head -1)
          STAGED=$(ls work/src/* | head -1)
          python3 pigeon/tools/spec_source_alias.py --spec "$SPEC" \
            --sources work/src --staged "$STAGED" \
            --recipe-dir "pigeon/packages/${{ inputs.package }}"
        else
          echo "no staged source (local package?), skipping aliases"
        fi
