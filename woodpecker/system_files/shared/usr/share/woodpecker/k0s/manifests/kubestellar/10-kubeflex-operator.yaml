apiVersion: v1
kind: Namespace
metadata:
  name: kubeflex-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflex-operator
  namespace: kubeflex-system
  labels:
    app.kubernetes.io/name: kubeflex-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeflex-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeflex-operator
    spec:
      containers:
        - name: operator
          image: ghcr.io/kubestellar/kubeflex/operator:0.5.0
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=127.0.0.1:8080
          env:
            - name: WATCH_NAMESPACE
              value: ""