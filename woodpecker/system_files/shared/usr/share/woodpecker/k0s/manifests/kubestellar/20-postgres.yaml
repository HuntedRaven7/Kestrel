apiVersion: v1
kind: Namespace
metadata:
  name: kubeflex-system
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kubeflex-system
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kubeflex-system
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: kubeflex
            - name: POSTGRES_USER
              value: kubeflex
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeflex-postgres
                  key: password
                  optional: false
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}