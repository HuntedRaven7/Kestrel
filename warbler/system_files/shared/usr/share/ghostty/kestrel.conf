# Kestrel Warbler ghostty config
# User overrides in ~/.config/ghostty/config

# Shell
shell = fish

# Font
font-family = "JetBrains Mono"
font-size = 11

# Window
window-width = 120
window-height = 40
window-padding = 10
window-decoration = "client-side"
window-title = "Ghostty - Warbler"

# Colors (Catppuccin Mocha)
background = #1e1e2e
foreground = #cdd6f4
cursor-color = #f5e0dc
selection-background = #585b70
selection-foreground = #cdd6f4

palette = [
    #0 = #1e1e2e, #8 = #585b70
    #1 = #f38ba8, #9 = #f38ba8
    #2 = #a6e3a1, #10 = #a6e3a1
    #3 = #f9e2af, #11 = #f9e2af
    #4 = #89b4fa, #12 = #89b4fa
    #5 = #f5c2e7, #13 = #f5c2e7
    #6 = #94e2d5, #14 = #94e2d5
    #7 = #bac2de, #15 = #a6adc8
]

# Keybindings
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+w=close_tab
keybind = ctrl+shift+q=quit

# Background opacity
background-opacity = 0.95

# Scrollback
scrollback-lines = 10000