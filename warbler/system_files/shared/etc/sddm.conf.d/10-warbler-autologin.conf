# Warbler SDDM autologin (opt-in kiosk behavior).
# The login user is created at install time: set User= then, never bake in
# a known password (see AGENTS.md safety). Empty User = no autologin.
[Autologin]
User=
Session=mango.desktop
Relogin=false

[Theme]
# Built-in maldives theme: no breeze/plasma dependency.
Current=maldives
