# Root-level Packit monorepo config for Kestrel Pigeon factory.
# Packit uses the factory's verified source archives (actions.create-archive).
actions:
  create-archive:
    - bash -c 'python3 "$(git rev-parse --show-toplevel)/pigeon/tools/packit_source0.py"'
packages:
  ModemManager:
    specfile_path: ModemManager.spec
    upstream_package_name: ModemManager
    downstream_package_name: ModemManager
